<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE042"/>
      <stop offset="50%" stop-color="#FCD116"/>
      <stop offset="100%" stop-color="#C69E00"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00A3DD"/>
      <stop offset="100%" stop-color="#006494"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24C943"/>
      <stop offset="100%" stop-color="#148028"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Shadow Ring -->
  <circle cx="250" cy="250" r="230" fill="#0A2540" filter="url(#shadow)"/>
  
  <!-- Outer Gold Ring -->
  <circle cx="250" cy="250" r="224" fill="none" stroke="url(#goldGrad)" stroke-width="8"/>
  <circle cx="250" cy="250" r="214" fill="#0B3056"/>

  <!-- Tanzania Flag Outer Accent Ring -->
  <circle cx="250" cy="250" r="212" fill="none" stroke="#1EB53A" stroke-width="4"/>

  <!-- Circular Text Path for TANZANIA REVENUE AUTHORITY -->
  <path id="topTextArc" d="M 75 250 A 175 175 0 0 1 425 250" fill="none"/>
  <text fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="21" letter-spacing="3.5">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      TANZANIA REVENUE AUTHORITY
    </textPath>
  </text>

  <!-- Circular Text Path for Motto: KODI KWA MAENDELEO YA TAIFA -->
  <path id="bottomTextArc" d="M 420 250 A 170 170 0 0 1 80 250" fill="none"/>
  <text fill="url(#goldGrad)" font-family="'Inter', sans-serif" font-weight="800" font-size="16" letter-spacing="2.5">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      ★ KODI KWA MAENDELEO YA TAIFA ★
    </textPath>
  </text>

  <!-- Inner Center Ring -->
  <circle cx="250" cy="250" r="145" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="6"/>
  
  <!-- Center Tanzania Flag Diagonal Stripes -->
  <g clip-path="url(#centerClip)">
    <clipPath id="centerClip">
      <circle cx="250" cy="250" r="139"/>
    </clipPath>
    <!-- Base White -->
    <rect x="100" y="100" width="300" height="300" fill="#F8FAFC"/>
    
    <!-- Top Green Triangle -->
    <polygon points="110,110 390,110 110,390" fill="url(#greenGrad)"/>
    <!-- Bottom Blue Triangle -->
    <polygon points="390,390 110,390 390,110" fill="url(#blueGrad)"/>
    <!-- Diagonal Yellow Border -->
    <polygon points="100,340 340,100 400,100 400,160 160,400 100,400" fill="#FCD116"/>
    <!-- Diagonal Black Stripe -->
    <polygon points="110,370 370,110 390,110 390,130 130,390 110,390" fill="#111827"/>
  </g>

  <!-- Center Crest: Golden Shield & Eagle/Torch Emblem -->
  <g transform="translate(250, 240)">
    <!-- Golden Gear / Industrial Ring -->
    <circle cx="0" cy="0" r="72" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="8, 6"/>
    
    <!-- Central White Disk -->
    <circle cx="0" cy="0" r="66" fill="#0A2540" stroke="#FFFFFF" stroke-width="3"/>

    <!-- Bold TRA Letters -->
    <text x="0" y="14" fill="url(#goldGrad)" font-family="'Outfit', 'Impact', sans-serif" font-weight="900" font-size="46" text-anchor="middle" letter-spacing="2">
      TRA
    </text>

    <!-- Subtitle: TAXRAHISI -->
    <rect x="-48" y="24" width="96" height="15" rx="7" fill="#1EB53A"/>
    <text x="0" y="35" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="9" text-anchor="middle" letter-spacing="1">
      TAXRAHISI
    </text>

    <!-- Freedom Torch / Uhuru Flame Icon at Top -->
    <path d="M -6 -48 C -6 -56 6 -56 6 -48 C 6 -42 0 -38 0 -34 L 0 -22 L -3 -22 L -3 -34 C -3 -38 -6 -42 -6 -48 Z" fill="#FFE042"/>
    <circle cx="0" cy="-48" r="4" fill="#FF5722"/>
  </g>

  <!-- Two Gold Stars on Side -->
  <polygon points="85,250 89,240 99,240 91,246 94,256 85,250 76,256 79,246 71,240 81,240" fill="url(#goldGrad)"/>
  <polygon points="415,250 419,240 429,240 421,246 424,256 415,250 406,256 409,246 401,240 411,240" fill="url(#goldGrad)"/>
</svg>
